name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The game's interop assemblies cannot be published, so compile against stand-ins that carry the same
      # assembly names and member shapes. The resulting DLL binds to the real ones inside the game.
      - name: Build Unity stand-ins
        run: |
          for p in Core/UnityEngine.CoreModule Imgui/UnityEngine.IMGUIModule; do
            dotnet build "ci/UnityStubs/$p.csproj" -c Release -o ci/stubs-out
          done

      - name: Build plugin
        run: >
          dotnet build CarXModManager.csproj -c Release -o out
          -p:UseBepInExPackages=true
          -p:SourceRevisionId="$GITHUB_SHA"
          -p:GameInteropDirectory="$GITHUB_WORKSPACE/ci/stubs-out"

      - name: Package
        run: |
          mkdir -p package/CarXModManager
          cp out/CarXModManager.dll out/CarXModManager.xml package/CarXModManager/
          (cd package && zip -r ../CarXModManager.zip CarXModManager)

      - uses: actions/upload-artifact@v4
        with:
          name: CarXModManager
          path: CarXModManager.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace only this build's own release (0.1-alpha); no other release is touched.
          gh release delete 0.1-alpha --cleanup-tag --yes || true
          gh release create 0.1-alpha CarXModManager.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Compatibility Layer 0.1-alpha" \
            --notes "Dev build from $GITHUB_SHA, not yet tested in-game. Extract CarXModManager.zip into BepInEx/plugins, launch, and look at the bottom-left corner of the screen. BepInEx/LogOutput.log should contain COMPATLAYER_LOADED and STATUSLINE_FIRST_DRAW."
