name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run the tests
        run: dotnet run --project tests -c Release

      # The game's interop assemblies cannot be published, so compile against generated stand-ins that carry the same assembly
      # names and member signatures (see ci/GameStubs/README.md). The resulting DLL binds to the real ones inside the game.
      - name: Build the game stand-ins
        run: |
          while read -r project; do
            dotnet build "ci/GameStubs/$project" -c Release -o ci/stubs-out
          done < ci/GameStubs/build-order.txt

      - name: Build plugin
        run: >
          dotnet build CarXModManager.csproj -c Release -o out
          -p:UseBepInExPackages=true
          -p:SourceRevisionId="$GITHUB_SHA"
          -p:GameInteropDirectory="$GITHUB_WORKSPACE/ci/stubs-out"

      - name: Package
        run: |
          mkdir -p package/CarXModManager
          cp out/CarXModManager.dll out/CarXModManager.xml package/CarXModManager/
          (cd package && zip -r ../CarXModManager.zip CarXModManager)

      - uses: actions/upload-artifact@v4
        with:
          name: CarXModManager
          path: CarXModManager.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace only this build's own release (0.1-alpha); no other release is touched.
          gh release delete 0.1-alpha --cleanup-tag --yes || true
          gh release create 0.1-alpha CarXModManager.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Compatibility Layer 0.1-alpha" \
            --notes "Dev build from $GITHUB_SHA, not yet tested in-game. Extract CarXModManager.zip into BepInEx/plugins and launch. The bottom-left corner of the screen shows the mod status line; the server browser and the create-room screen get the new search and map-list panels. BepInEx/LogOutput.log should contain COMPATLAYER_LOADED, INTEGRATIONS_LOADED and HOOK_CREATED lines."
